services:
  mediclaim-auth:
    build: .
    image: mediclaim-auth:1.0
    container_name: mediclaim-auth
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment}
      OTP_DEBUG: "true"
      DATABASE_PATH: /data/mediclaim.db
    volumes:
      - mediclaim_auth_data:/data
    restart: unless-stopped

volumes:
  mediclaim_auth_data:
